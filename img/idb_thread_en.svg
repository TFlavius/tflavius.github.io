<svg xmlns="http://www.w3.org/2000/svg" width="413" height="447" viewBox="0 0 413 447" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img">
<title>A separate IndexedDB thread</title>
<desc>The main thread validates and prepares the request and puts it into the job queue; the IndexedDB thread runs database operations through SQLite and returns the result through the completion queue; the main thread reconstructs the objects and fires events for the page.</desc>
