<text x="382.7" y="178.7" font-size="13" fill="#1f2328" text-anchor="middle">pixels in main memory</text>
<path d="M271.9,174.6 H304.9" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="140.8" y="233.6" width="93.7" height="33.9" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
<text x="187.7" y="254.7" font-size="13" fill="#1f2328" text-anchor="middle">3D backend</text>
