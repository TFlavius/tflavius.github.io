<text x="90.8" y="121.0" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">VEGA</text>
<path d="M90.8,67.9 V96.9" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
