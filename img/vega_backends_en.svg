<svg xmlns="http://www.w3.org/2000/svg" width="579" height="307" viewBox="0 0 579 307" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img">
<title>VEGA backends</title>
<desc>The page, SVG, canvas and Opera's interface are all drawn through VEGA. It has two paths: a software rasterizer producing pixels in main memory, and a 3D backend on top of a shared graphics device interface implemented with Direct3D 10.1 and OpenGL.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6e7781"/></marker></defs>
