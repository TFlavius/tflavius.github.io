<text x="158.5" y="38.1" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">JavaScript</text>
<text x="158.5" y="55.4" font-size="12" fill="#59636e" text-anchor="middle">parameters, input array, CryptoKey</text>
<rect x="20.0" y="95.9" width="277.0" height="51.9" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="158.5" y="118.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Web layer</text>
<text x="158.5" y="135.3" font-size="12" fill="#59636e" text-anchor="middle">conversions, Promise, request state</text>
<path d="M60.0,67.9 V94.9" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="20.0" y="175.8" width="277.0" height="51.9" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
<text x="158.5" y="197.9" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">CryptoExecutor</text>
<text x="158.5" y="215.2" font-size="12" fill="#59636e" text-anchor="middle">data snapshot, key permissions, limits, queues</text>
<path d="M60.0,147.8 V174.8" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="110.0" y="244.7" width="134.1" height="33.9" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="177.0" y="265.8" font-size="13" fill="#1f2328" text-anchor="middle">background thread</text>
