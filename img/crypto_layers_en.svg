<svg xmlns="http://www.w3.org/2000/svg" width="640" height="413" viewBox="0 0 640 413" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Web Crypto architecture in Otium</title>
<desc>JavaScript hands the parameters to the web layer, which passes them to CryptoExecutor. The executor sends the work either to a background thread with the OpenSSL adapters, or through a broker and a private channel to the helper process with the same adapters. The finished native result goes back to the web layer and settles the Promise.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6e7781"/></marker></defs>
<rect width="640" height="413" fill="#ffffff"/>
