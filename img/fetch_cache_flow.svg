<svg xmlns="http://www.w3.org/2000/svg" width="725" height="579" viewBox="0 0 725 579" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Fetch и общий кеш</title>
<desc>fetch() создаёт личный URL_Rep. В режиме no-store запрос идёт в сеть и ничего не кеширует. Иначе Fetch ищет в URL_Store общий ответ, полученный на такой же запрос: свежий отдаётся из кеша, устаревший перепроверяется условным запросом (304 продлевает общую копию, 200 заменяет её), при отсутствии делается обычный запрос. Полученный целиком кешируемый ответ становится общей записью.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6e7781"/></marker></defs>
<rect width="725" height="579" fill="#ffffff"/>
<rect x="20.0" y="16.0" width="156.6" height="33.9" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="98.3" y="37.1" font-size="13" fill="#1f2328" font-family="Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace" text-anchor="middle">fetch(url, {...})</text>
<rect x="20.0" y="79.9" width="272.9" height="51.9" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
<text x="156.4" y="102.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">личный URL_Rep</text>
<text x="156.4" y="119.3" font-size="12" fill="#59636e" text-anchor="middle">заголовки, куки, CORS, режим кеша, отмена</text>
<path d="M44.0,49.9 V78.9" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="20.0" y="199.8" width="341.3" height="51.9" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="32.0" y="220.9" font-size="13" fill="#1f2328" font-weight="600">Есть в URL_Store общий ответ для этого адреса,</text>
<text x="32.0" y="238.9" font-size="13" fill="#1f2328" font-weight="600">полученный на такой же запрос (Vary)?</text>
<path d="M44.0,131.8 V198.8" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="270.0" y="148.8" width="212.4" height="33.9" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
<text x="376.2" y="169.9" font-size="13" fill="#1f2328" text-anchor="middle">сеть, в кеш ничего не кладётся</text>
<path d="M44.0,165.8 H269.0" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="270.0" y="270.7" width="164.9" height="33.9" rx="6" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.2"/>
<text x="352.5" y="291.8" font-size="13" fill="#1f2328" text-anchor="middle">вернуть копию из кеша</text>
<rect x="270.0" y="335.8" width="141.0" height="51.9" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
<text x="340.5" y="356.9" font-size="13" fill="#1f2328" text-anchor="middle">личный GET</text>
<text x="340.5" y="374.8" font-size="13" fill="#1f2328" font-family="Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace" text-anchor="middle">+ If-None-Match</text>
<rect x="270.0" y="436.7" width="99.8" height="33.9" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
<text x="319.9" y="457.8" font-size="13" fill="#1f2328" text-anchor="middle">личный GET</text>
<path d="M44.0,251.7 V453.7 H269.0" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M44.0,287.7 H269.0" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M44.0,361.7 H269.0" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="475.0" y="305.8" width="172.6" height="51.9" rx="6" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.2"/>
<text x="561.3" y="326.9" font-size="13" fill="#1f2328" text-anchor="middle">продлить общую копию,</text>
<text x="561.3" y="344.8" font-size="13" fill="#1f2328" text-anchor="middle">читать её</text>
<rect x="475.0" y="374.7" width="172.6" height="33.9" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="561.3" y="395.8" font-size="13" fill="#1f2328" text-anchor="middle">заменить общую копию</text>
<path d="M411.0,361.7 H437.0 V331.7 H474.0" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M411.0,361.7 H437.0 V391.7 H474.0" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="270.0" y="511.7" width="435.8" height="51.9" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
<text x="487.9" y="532.8" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">ответ получен целиком и его можно кешировать:</text>
<text x="487.9" y="550.7" font-size="13" fill="#1f2328" text-anchor="middle">URL_Rep очищается от всего личного и становится общей записью</text>
<path d="M319.9,470.7 V510.7" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M561.3,408.7 V510.7" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="163.0" y="158.8" font-size="12" fill="#59636e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">режим no-store</text>
<text x="161.0" y="280.7" font-size="12" fill="#59636e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">да, свежий</text>
<text x="161.0" y="354.7" font-size="12" fill="#59636e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">да, устарел, есть ETag</text>
<text x="161.0" y="446.7" font-size="12" fill="#59636e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">нет</text>
<text x="457.0" y="325.7" font-size="12" fill="#59636e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">304</text>
<text x="457.0" y="385.7" font-size="12" fill="#59636e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200</text>
<text x="327.9" y="495.2" font-size="12" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200</text>
</svg>
