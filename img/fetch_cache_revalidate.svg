<svg xmlns="http://www.w3.org/2000/svg" width="922" height="389" viewBox="0 0 922 389" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Повторное обращение к ресурсу</title>
<desc>Если копии нет — GET и сохранение. Если копия свежая — отдать её без сети. Если устарела, но есть ETag или дата — условный GET с If-None-Match: ответ 304 продлевает копию, 200 заменяет её. Иначе — обычный GET и замена копии.</desc>
