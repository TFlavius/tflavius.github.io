<svg xmlns="http://www.w3.org/2000/svg" width="682" height="413" viewBox="0 0 682 413" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Архитектура Web Crypto в Otium</title>
<desc>JavaScript передаёт параметры веб-слою, тот — CryptoExecutor. Исполнитель отправляет работу либо в фоновый поток к адаптерам OpenSSL, либо через брокер и частный канал процессу-помощнику с теми же адаптерами. Готовый нативный результат возвращается в веб-слой и завершает Promise.</desc>
